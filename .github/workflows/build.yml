name: Build (native + wasm)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (rustup)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          . "$HOME/.cargo/env"
          rustup target add wasm32-unknown-unknown
          rustc --version

      - name: System deps (bevy native, Debian/Ubuntu)
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq pkg-config libasound2-dev libudev-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libwayland-dev libxkbcommon-dev || true
          fi

      - name: Build native (release)
        run: |
          . "$HOME/.cargo/env"
          cargo build --release

      - name: Build wasm (release)
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --target wasm32-unknown-unknown

      - name: wasm-bindgen
        run: |
          . "$HOME/.cargo/env"
          if ! command -v wasm-bindgen >/dev/null 2>&1; then
            cargo install wasm-bindgen-cli --locked
          fi
          mkdir -p dist
          wasm-bindgen --target web --no-typescript --out-dir dist \
            target/wasm32-unknown-unknown/release/resort_empire.wasm
          cp -r assets dist/assets
          cp web/index.html dist/index.html

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: resort_empire-linux
          path: target/release/resort_empire

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: resort_empire-web
          path: dist/
